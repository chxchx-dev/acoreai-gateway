# Nginx público para AlanIA — chat.alania.com.co
#
# Flujo para instalar:
#   1. Copiar este archivo a /etc/nginx/sites-available/chat.alania.com.co
#   2. ln -sf ... /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#   4. certbot --nginx -d chat.alania.com.co   (si aún no hay certificado)
#
# El bloque /gw/ proxy-ifica el AI Gateway HTTP sin Mixed Content ni CORS.

# ── HTTP: solo acme-challenge y redirect ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name chat.alania.com.co;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
# (Certbot rellena los certificados al ejecutar --nginx)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chat.alania.com.co;

    # Certbot completa estas rutas automáticamente:
    # ssl_certificate     /etc/letsencrypt/live/chat.alania.com.co/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/chat.alania.com.co/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Proxy al AI Gateway HTTP (evita Mixed Content + CORS desde el frontend) ─
    location /gw/ {
        # Preflight OPTIONS
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, x-ai-gateway-key' always;
            add_header 'Access-Control-Max-Age'       '86400' always;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, x-ai-gateway-key' always;

        # Esconder los headers CORS del backend para no duplicarlos
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Credentials';

        proxy_pass         http://ai.217-77-0-2.nip.io/;
        proxy_http_version 1.1;
        proxy_set_header   Host              ai.217-77-0-2.nip.io;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 10M;
    }

    # ── Frontend web ──────────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout    360s;
        proxy_send_timeout    360s;
    }
}
