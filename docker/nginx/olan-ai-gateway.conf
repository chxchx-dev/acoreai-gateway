# Nginx para el AI Gateway de AlanIA.
# Dominio: ai.217-77-0-2.nip.io → IP pública 217.77.0.2
#
# Pasos para activar HTTPS en el servidor:
#   1. sudo cp olan-ai-gateway.conf /etc/nginx/sites-available/olan-ai-gateway
#   2. sudo ln -sf /etc/nginx/sites-available/olan-ai-gateway /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d ai.217-77-0-2.nip.io
#   5. sudo systemctl reload nginx

# ── HTTP → redirige a HTTPS ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ai.217-77-0-2.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ai.217-77-0-2.nip.io;

    ssl_certificate     /etc/letsencrypt/live/ai.217-77-0-2.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.217-77-0-2.nip.io/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # SSE — sin buffering para que el stream llegue al cliente en tiempo real
    location /api/chat/stream {
        proxy_pass http://127.0.0.1:4005;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/translate/stream {
        proxy_pass http://127.0.0.1:4005;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:4005;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout    90s;
    }
}
