# Nginx público para OLAN Web IA — alania.olan.com.co
#
# Objetivo:
# - Mantener el frontend en HTTPS
# - Proxyear /api/* al gateway real HTTP: http://ai.217-77-0-2.nip.io:4005
# - Evitar Mixed Content en navegador
#
# Ajusta SOLO este upstream si tu frontend web/olan escucha en otro puerto:
#   proxy_pass http://127.0.0.1:5176;

server {
    listen 80;
    listen [::]:80;
    server_name alania.olan.com.co;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name alania.olan.com.co;

    # Certbot completa estas rutas:
    # ssl_certificate     /etc/letsencrypt/live/alania.olan.com.co/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/alania.olan.com.co/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location /api/chat/stream {
        proxy_pass http://ai.217-77-0-2.nip.io:4005;
        proxy_http_version 1.1;

        proxy_set_header Host              ai.217-77-0-2.nip.io;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header x-ai-gateway-key  Alania2026-F0D0Mj14Z9LLzZXk8pQrNv;
        proxy_set_header Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/translate/stream {
        proxy_pass http://ai.217-77-0-2.nip.io:4005;
        proxy_http_version 1.1;

        proxy_set_header Host              ai.217-77-0-2.nip.io;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header x-ai-gateway-key  Alania2026-F0D0Mj14Z9LLzZXk8pQrNv;
        proxy_set_header Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/chat/perspectives/stream {
        proxy_pass http://ai.217-77-0-2.nip.io:4005;
        proxy_http_version 1.1;

        proxy_set_header Host              ai.217-77-0-2.nip.io;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header x-ai-gateway-key  Alania2026-F0D0Mj14Z9LLzZXk8pQrNv;
        proxy_set_header Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location /api/ {
        proxy_pass http://ai.217-77-0-2.nip.io:4005;
        proxy_http_version 1.1;

        proxy_set_header Host              ai.217-77-0-2.nip.io;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header x-ai-gateway-key  Alania2026-F0D0Mj14Z9LLzZXk8pQrNv;
    }

    location /health/ {
        proxy_pass http://ai.217-77-0-2.nip.io:4005;
        proxy_http_version 1.1;

        proxy_set_header Host              ai.217-77-0-2.nip.io;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:5176;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout    360s;
        proxy_send_timeout    360s;
    }
}
